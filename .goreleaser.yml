# otel-cli release configuration for GoReleaser v2.
#
# .github/workflows/release.yml drives this on every `v*` tag (and runs it as a
# snapshot on workflow_dispatch to smoke the matrix without publishing). Locally:
#
#   goreleaser release --snapshot --clean --skip=publish,sign,sbom
#
# GoReleaser owns the binaries, archives, Linux packages, checksums, SBOM, the
# keyless cosign signature over checksums.txt, the GitHub release, and the
# Homebrew formula. The container image is deliberately NOT built here: the
# workflow assembles it from the Linux binaries GoReleaser leaves in dist/, so
# that the image can be pushed by digest, signed, attested, and only THEN tagged
# — GoReleaser's docker pipeline signs after tagging, which leaves the ghcr
# package page advertising a signature artifact as "latest" (kaibo v0.2.0-rc.4
# hit exactly that). Keep the image out of this file.
version: 2

project_name: otel-cli

before:
  hooks:
    # Verify, never tidy: a hook that rewrites go.mod would release a tree that
    # differs from the tag. CI enforces tidiness on every pull request instead.
    - go mod verify

report_sizes: true

builds:
  - id: otel-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: freebsd
        goarch: arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}

archives:
  - id: archives
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    builds_info:
      group: root
      owner: root

nfpms:
  - package_name: otel-cli
    homepage: https://github.com/tobert/otel-cli
    maintainer: Amy Tobey <tobert@github.com>
    description: OpenTelemetry CLI Application (Server & Client)
    license: Apache 2.0
    formats:
      - apk
      - deb
      - rpm

checksum:
  name_template: "checksums.txt"

# One SBOM for the whole release, cataloged from go.mod/go.sum (every target
# shares the same module graph), rather than one document per archive.
# `artifacts: any` + one `documents` entry is the documented shape for that
# (verified on v2.18: exactly one SBOM, listed in checksums.txt). syft is
# installed by the workflow; local snapshot runs pass --skip=sbom.
sboms:
  - id: source
    artifacts: any
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_sbom.spdx.json"
    cmd: syft
    args: ["dir:.", "--exclude", "./dist/**", "--output", "spdx-json=$document"]

# Keyless cosign over checksums.txt only: verify the manifest once and it covers
# every file it lists. The .sigstore.json bundle is self-contained (certificate,
# signature, Rekor entry) so verification works offline. cosign v3 ignores the
# legacy --output-signature/--output-certificate pair in bundle mode, hence the
# single --bundle flag. The signing identity is the release workflow at the tag,
# minted from the job's id-token — there is no key to store or leak.
signs:
  - id: checksums
    artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

changelog:
  # GitHub's auto-generated notes (grouped by PR, with contributors). The header
  # above them comes from .github/release-body.md via --release-header-tmpl.
  use: github-native

release:
  github:
    owner: tobert
    name: otel-cli
  # A semver prerelease tag (v1.0.0-rc.1) becomes a GitHub prerelease and is
  # never marked latest, so the Releases page always leads with a stable build.
  prerelease: auto
  make_latest: "{{ not .Prerelease }}"
  # A re-run after a partial failure (say, the Homebrew push) must be able to
  # finish the same release instead of tripping over assets it already uploaded.
  replace_existing_artifacts: true

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

# Formula, not cask, on purpose: GoReleaser deprecates `brews` in favor of
# `homebrew_casks`, but casks are macOS-only and the existing tap serves Linux
# users too. Moving to a cask would also make every current `brew install
# otel-cli` user reinstall. Tracked in the repo issues; revisit when GoReleaser
# v3 removes `brews`. This means `goreleaser check` reports a deprecation — CI
# validates the config with a snapshot build instead.
brews:
  - name: otel-cli
    ids: ["archives"]
    url_template: "https://github.com/tobert/otel-cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    # The repository must be tobert/homebrew-otel-cli for `brew tap tobert/otel-cli`.
    # GITHUB_TOKEN is scoped to this repo, so pushing the formula into the tap
    # takes a separate fine-grained PAT with Contents: write on the tap repo.
    repository:
      owner: tobert
      name: homebrew-otel-cli
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: tobert
      email: tobert@gmail.com
    commit_msg_template: "otel-cli {{ .Tag }}"
    homepage: https://github.com/tobert/otel-cli
    description: "OpenTelemetry command-line tool for sending events from shell scripts & similar environments"
    license: Apache-2.0
    test: |
      system "#{bin}/otel-cli", "version"
    # auto: a prerelease tag is released on GitHub but never pushed to the tap.
    skip_upload: auto
